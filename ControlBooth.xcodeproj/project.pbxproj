				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/libhogweed.6.dylib",
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/libgmp.10.dylib",
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/libp11-kit.0.dylib",
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/libtasn1.6.dylib",
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/libidn2.0.dylib",
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/libunistring.5.dylib",
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/libbrotlicommon.1.dylib",
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/libbrotlidec.1.dylib",
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/libbrotlienc.1.dylib",
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/libbz2.1.0.dylib",
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Frameworks/liblzma.5.dylib",

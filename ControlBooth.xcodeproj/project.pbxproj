			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n# shairport-sync / sox / stereodemux / ffmpeg and their dylib closures are\n# vendored ad-hoc signed (by scripts/build-shairport-sync.sh and the sibling\n# AntennaHead / ControlBooth checkouts). Copy each into the app, then re-sign it\n# with this target's real signing identity + hardened runtime (plus a secure\n# timestamp for Release) so the app can be notarized -- Apple's notary service\n# rejects ad-hoc signed Mach-O.\nBUNDLE=\"${BUILT_PRODUCTS_DIR}/AirPlayReceiver_AirPlayReceiver.bundle/Contents/Resources/Resources\"\nAPP_DIR=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\"\nHELPERS_DIR=\"${APP_DIR}/Contents/Helpers\"\nFRAMEWORKS_DIR=\"${APP_DIR}/Contents/Frameworks\"\nmkdir -p \"${HELPERS_DIR}\" \"${FRAMEWORKS_DIR}\"\n\nSIGN_ID=\"${EXPANDED_CODE_SIGN_IDENTITY:-}\"\nTS=\"--timestamp\"\nif [ \"${CONFIGURATION}\" = \"Debug\" ]; then TS=\"--timestamp=none\"; fi\nresign() {\n  [ -f \"$1\" ] || return 0\n  { [ -n \"${SIGN_ID}\" ] && [ \"${SIGN_ID}\" != \"-\" ]; } || return 0\n  codesign --force --options runtime ${TS} --sign \"${SIGN_ID}\" \"$1\"\n}\n\n# ControlBooth doesn't otherwise bundle sox (its user pipelines reference\n# tools by absolute path), but AirPlayReceiverController's resample stage\n# needs Contents/Helpers/sox like AntennaHead already has; vendor it from\n# the sibling AntennaHead checkout in this umbrella.\ncp -f \"${SRCROOT}/../AntennaHead/sox\" \"${HELPERS_DIR}/sox\"\nchmod +x \"${HELPERS_DIR}/sox\"\nresign \"${HELPERS_DIR}/sox\"\n\n# stereodemux (FM-stereo multiplex decoder) is likewise only vendored as a\n# plain binary in the AntennaHead checkout, not an SPM package product;\n# vendor it the same way as sox above, plus its own dylib dependency closure\n# (liquid-dsp for the demod math, libsndfile and the audio codecs it links,\n# none of which ControlBooth otherwise bundles).\ncp -f \"${SRCROOT}/../AntennaHead/stereodemux\" \"${HELPERS_DIR}/stereodemux\"\nchmod +x \"${HELPERS_DIR}/stereodemux\"\nresign \"${HELPERS_DIR}/stereodemux\"\n\nfor name in libliquid.dylib libfec.dylib libfftw3f.3.dylib libsndfile.1.dylib libFLAC.14.dylib libvorbisenc.2.dylib libmp3lame.0.dylib libogg.0.dylib libmpg123.0.dylib libopus.0.dylib libvorbis.0.dylib; do\n  cp -f \"${SRCROOT}/../AntennaHead/${name}\" \"${FRAMEWORKS_DIR}/${name}\"\n  resign \"${FRAMEWORKS_DIR}/${name}\"\ndone\n\nSHAIRPORT_LIBS=\"libconfig.11.dylib libcrypto.3.dylib libiconv.2.dylib libintl.8.dylib libpopt.0.dylib libsoxr.0.dylib libssl.3.dylib libz.1.dylib\"\nfor name in ${SHAIRPORT_LIBS}; do\n  cp -f \"${BUNDLE}/Frameworks/${name}\" \"${FRAMEWORKS_DIR}/${name}\"\n  resign \"${FRAMEWORKS_DIR}/${name}\"\ndone\n\ncp -f \"${BUNDLE}/shairport-sync\" \"${HELPERS_DIR}/shairport-sync\"\nchmod +x \"${HELPERS_DIR}/shairport-sync\"\nresign \"${HELPERS_DIR}/shairport-sync\"\n\n# ffmpeg (LGPL-only custom build: --disable-gpl --disable-nonfree, with\n# X11/AppKit/CoreImage/SDL2/avfoundation stripped since VideoToolbox pulls\n# in an unconditional -lX11 on Darwin otherwise) -- decodes arbitrary\n# HTTP(S)/HLS web-radio streams into raw PCM for user-authored ControlBooth\n# pipelines to hand off to PCMUDPSender. Not an SPM package product;\n# vendored as a plain binary + its dylib closure from ControlBooth's own\n# checkout. All install names already point at @executable_path/../Frameworks/\n# <name>. libz.1/libintl.8/libiconv.2 are deliberately NOT re-vendored -- the\n# shairport-sync block above already provides SONAME-compatible copies at the\n# same destination.\ncp -f \"${SRCROOT}/ffmpeg\" \"${HELPERS_DIR}/ffmpeg\"\nchmod +x \"${HELPERS_DIR}/ffmpeg\"\nresign \"${HELPERS_DIR}/ffmpeg\"\n\nfor name in libavcodec.62.dylib libavfilter.11.dylib libavformat.62.dylib libavutil.60.dylib libswresample.6.dylib libgnutls.30.dylib libnettle.8.dylib libhogweed.6.dylib libgmp.10.dylib libp11-kit.0.dylib libtasn1.6.dylib libidn2.0.dylib libunistring.5.dylib libbrotlicommon.1.dylib libbrotlidec.1.dylib libbrotlienc.1.dylib libbz2.1.0.dylib liblzma.5.dylib libffi.8.dylib libzstd.1.dylib; do\n  cp -f \"${SRCROOT}/${name}\" \"${FRAMEWORKS_DIR}/${name}\"\n  resign \"${FRAMEWORKS_DIR}/${name}\"\ndone\n\n# The AirPlayReceiver SwiftPM resource bundle carries its own copy of the\n# shairport-sync payload; re-sign those in place so they don't fail\n# notarization either.\nAPR_RES=\"${APP_DIR}/Contents/Resources/AirPlayReceiver_AirPlayReceiver.bundle/Contents/Resources/Resources\"\nif [ -d \"${APR_RES}\" ]; then\n  for name in ${SHAIRPORT_LIBS}; do\n    resign \"${APR_RES}/Frameworks/${name}\"\n  done\n  resign \"${APR_RES}/shairport-sync\"\nfi\n";
		};
